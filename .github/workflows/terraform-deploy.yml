name: Terraform Deploy - Bootstrap

on:
  push:
    branches: [main, develop, "feature/*", "release/*"]
    paths:
      - 'live/**'
      - 'modules/**'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'live/**'
      - 'modules/**'
      - '.github/workflows/terraform-deploy.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC - weekly drift detection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'Action to perform (plan = validate only, apply = plan + apply)'
        required: true
        default: plan
        type: choice
        options: [plan, apply]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: 'eu-west-1'
  TF_VERSION: '1.10.0'
  TG_VERSION: '0.67.0'

jobs:
  # ============================================================
  # Job 1: Detect Environment
  # ============================================================
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      env_upper:   ${{ steps.detect.outputs.env_upper }}
    steps:
      - id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV="qa"
          else
            ENV="dev"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "env_upper=$(echo ${ENV} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: Validate & Lint
  # Runs against modules/bootstrap (no AWS credentials needed)
  # ============================================================
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    needs: detect-environment
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: ./.github/actions/setup-terragrunt
        with:
          version: ${{ env.TG_VERSION }}

      - name: Terraform Format Check (modules)
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ./modules
        continue-on-error: true

      - name: Terragrunt HCL Format Check (live)
        id: hclfmt
        run: terragrunt hclfmt --terragrunt-check --terragrunt-working-dir ./live
        continue-on-error: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987 # v4.0.0
        with:
          tflint_version: latest

      - name: Run TFLint
        id: tflint
        run: |
          tflint --init
          tflint --format compact
        working-directory: ./modules/bootstrap
        continue-on-error: true

      - name: Comment PR - Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### 🎨 Terraform Format (modules): \`${{ steps.fmt.outcome }}\`
            #### 🎨 Terragrunt HCL Format (live): \`${{ steps.hclfmt.outcome }}\`
            #### 🔍 TFLint: \`${{ steps.tflint.outcome }}\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`
            })

  # ============================================================
  # Job 3: Security Scan
  # Scans modules/bootstrap Terraform code
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@fdc39ed8de1c0e9d68305ca19c0ba95c3601695 # v3.2.1
        with:
          directory: ./modules/bootstrap
          framework: terraform
          output_format: cli
          soft_fail: true
          quiet: false

      - name: Run tfsec
        id: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: ./modules/bootstrap
          soft_fail: true

      - name: Comment PR - Security Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### 🔒 Security Scan Results

            - **Checkov**: \`${{ steps.checkov.outcome }}\`
            - **tfsec**: \`${{ steps.tfsec.outcome }}\`

            *Environment: \`${{ needs.detect-environment.outputs.environment }}\`*`
            })

  # ============================================================
  # Job 4: Terragrunt Plan
  # Working dir: live/{env}/bootstrap — backend + inputs from Terragrunt config
  # ============================================================
  plan:
    name: Terragrunt Plan
    runs-on: ubuntu-latest
    needs: [detect-environment, validate, security-scan]
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ENV: ${{ needs.detect-environment.outputs.environment }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: ./.github/actions/setup-terragrunt
        with:
          version: ${{ env.TG_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', needs.detect-environment.outputs.env_upper)] }}
          role-session-name: TerragruntPlan-${{ github.run_id }}-${{ env.ENV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            Project=bootstrap
            environment=${{ env.ENV }}
            github-org=${{ github.repository_owner }}
            github-actor=${{ github.actor }}
            managed-by=github-actions
            action=terragrunt-plan

      - name: Terragrunt Init
        run: terragrunt init -input=false -reconfigure
        working-directory: ./live/${{ env.ENV }}/bootstrap

      - name: Terragrunt Plan
        id: plan
        run: |
          terragrunt plan \
            -out=tfplan-${{ env.ENV }}.binary \
            -detailed-exitcode \
            -no-color
        working-directory: ./live/${{ env.ENV }}/bootstrap

      - name: Show plan output
        if: steps.plan.outputs.exitcode == '2'
        run: terragrunt show -no-color tfplan-${{ env.ENV }}.binary > /tmp/plan-output.txt
        working-directory: ./live/${{ env.ENV }}/bootstrap

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@65c4c4a1e8c8b35b6f9a1bcbb2cf4f56e98afe6c # v4.6.0
        with:
          name: tfplan-${{ env.ENV }}
          path: ./live/${{ env.ENV }}/bootstrap/tfplan-${{ env.ENV }}.binary
          retention-days: 5

      - name: Comment PR - Plan Results
        if: github.event_name == 'pull_request' && steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            const truncated = output.length > 60000 ? output.slice(-60000) : output;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `<details><summary>📋 Terragrunt Plan — ${{ env.ENV }} (click to expand)</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>\n\n*Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`
            })

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ============================================================
  # Job 5: Terragrunt Apply
  # Only runs when plan detected changes (exitcode == 2)
  # ============================================================
  apply:
    name: Terragrunt Apply
    runs-on: ubuntu-latest
    needs: [detect-environment, plan]
    if: |
      needs.plan.outputs.exitcode == '2' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'apply')
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ENV: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: ./.github/actions/setup-terragrunt
        with:
          version: ${{ env.TG_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', needs.detect-environment.outputs.env_upper)] }}
          role-session-name: TerragruntApply-${{ github.run_id }}-${{ env.ENV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            Project=bootstrap
            environment=${{ env.ENV }}
            github-org=${{ github.repository_owner }}
            github-actor=${{ github.actor }}
            managed-by=github-actions
            action=terragrunt-apply

      - name: Terragrunt Init
        run: terragrunt init -input=false -reconfigure
        working-directory: ./live/${{ env.ENV }}/bootstrap

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234c7afecc4b494e94 # v4.1.8
        with:
          name: tfplan-${{ env.ENV }}
          path: ./live/${{ env.ENV }}/bootstrap

      - name: Terragrunt Apply
        id: apply
        run: terragrunt apply -auto-approve tfplan-${{ env.ENV }}.binary
        working-directory: ./live/${{ env.ENV }}/bootstrap

      - name: Upload outputs artifact
        if: success()
        run: terragrunt output -json > outputs.json
        working-directory: ./live/${{ env.ENV }}/bootstrap

      - name: Upload outputs
        if: success()
        uses: actions/upload-artifact@65c4c4a1e8c8b35b6f9a1bcbb2cf4f56e98afe6c # v4.6.0
        with:
          name: terraform-outputs-${{ env.ENV }}
          path: ./live/${{ env.ENV }}/bootstrap/outputs.json
          retention-days: 30

      - name: Comment PR - Deployment Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### ✅ Deployment Successful - ${{ env.ENV }}

            **Run ID:** \`${{ github.run_id }}\` &nbsp; **Actor:** @${{ github.actor }}`
            })

  # ============================================================
  # Job 6: Drift Detection (runs every Monday 06:00 UTC)
  # Runs terragrunt plan for each environment in parallel
  # ============================================================
  drift-detection:
    name: Drift Detection (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare env
        id: prep
        run: echo "ENV_UPPER=$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: ./.github/actions/setup-terragrunt
        with:
          version: ${{ env.TG_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', steps.prep.outputs.ENV_UPPER)] }}
          role-session-name: DriftDetection-${{ github.run_id }}-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            Project=bootstrap
            environment=${{ matrix.environment }}
            managed-by=github-actions
            action=drift-detection

      - name: Terragrunt Init
        run: terragrunt init -input=false -reconfigure
        working-directory: ./live/${{ matrix.environment }}/bootstrap

      - name: Detect Drift
        id: drift
        run: |
          terragrunt plan \
            -detailed-exitcode \
            -no-color
        working-directory: ./live/${{ matrix.environment }}/bootstrap
        continue-on-error: true

      - name: Create issue if drift detected
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Infrastructure Drift Detected - ${{ matrix.environment }}`,
              body: `Drift detected in **${{ matrix.environment }}** environment.

            The real AWS state no longer matches the Terragrunt configuration.

            **Run:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Date:** ${new Date().toUTCString()}

            Please review and apply changes to reconcile infrastructure.`,
              labels: ['drift', 'infrastructure', '${{ matrix.environment }}']
            })